server:
  port: 8080
spring:
  liquibase:
    enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
    #          ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

telegram:
  mode: webhook
  token: ${BOT_TOKEN}
  admin-id: ${ADMIN_ID}
  bot-id: ${BOT_ID}
  webhook:
    url: ${WEBHOOK_URL}
    path: ${WEBHOOK_PATH}

