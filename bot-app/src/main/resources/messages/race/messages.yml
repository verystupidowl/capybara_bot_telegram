race:
  massage: "💆‍♂️ Ты сделал своей капибаре расслабляющий массаж и полностью восстановил её выносливость! ✨"
  start-race: "💬 Укажи через <code>@</code> ник пользователя, чью капибару ты хочешь вызвать на эпичный забег! 🏃"
  opponent-has-no-capy: "⚠️ У твоего соперника ещё нет капибары! Но он всегда может завести её командой <code>Взять капибару</code>."
  improvement:
    anti-lose: "💊 Твоя капибара приняла «Антипроигрыш»! Шанс победить — 90%!!! Но в случае поражения 30 единиц счастья уйдёт сопернику."
    watermelon: "🍉 Твоя капибара съела целый арбуз! Шанс победы уменьшается на 5%, зато при поражении питомец не потеряет счастье."
    boots: "🥾 Твоя капибара обула модные удобные ботиночки. Она побежит быстрее, а шанс на победу увеличен!"
    already-has-improvement: "⚠️ У твоей капибары уже куплено улучшение для этого забега!"

  running:
    starting-race: |
      🏃‍♂️ <b>Идёт забег капибар!</b> 🏁
      
      🤼 Соревнуются: <b>{0}</b> VS <b>{1}</b>
    running-race: |
      🏃 <b>Забег в самом разгаре!</b>
      
      {0} {1} пробежала {2}/{3}
      {4} {5} пробежала {6}/{7}
    win: |
      🏆 <b>Победа!</b>
      
      ✨ Выиграла капибара <b>{0}</b>! 
      Её счастье увеличено на <b>+{1}</b>.
      
      💔 Проигравший питомец (<b>{2}</b>) теряет <b>{3}</b> единиц счастья.
    draw: "😲 <b>Ничья!</b> Силы равны — капибары не получают и не теряют счастье! 🤝"