capybara:
  list-of-commands: |
    📃Список команд:

    Моя капибара - показывает всю информацию о твоей капибаре✨

    Топ капибар - показывает топ капибар по уровню на данный момент🔝

    Уволиться с работы - уволиться с работы👎

    В главное меню - возвращает кнопки снизу, если их не было👇🏻

    Пожениться (пересланное сообщение пользователя, на котором хочешь пожениться) - поженить капибар💍

    Расторгнуть брак - расторгнуть брак🙅🏻‍♂

    Брак подарок - принять подарок своей капибаре и капибаре партнеру🎁

    Забег <отметка пользователя , с кем хочешь устроить забег> (или пересланное сообщение игрока, с кем хочешь устроить забег) - игра-гонка, в которой соревнуются 2 капибары, кто быстрее прибежит к финишу🏎

    КМН - игра Камень, Ножницы, Бумага на 50 долек🍉

    Казино <Ставка-количество долек> <на что ставишь> - казино🎰
    Пример: Казино 500 красное

    Перевести/передать дольки <Количество> (пересланное сообщение пользователя, кому хочешь перевести дольки) - переводит дольки🍉

    Восстановить (пересланное сообщение бота, когда он последний раз присылал фото твоей капибары) - восстанавливает фото твоей капибары, если она была удалена🔄

    Список будет пополняться📈

  list-of-improvements: |
    ⬆Список улучшений для гонок (улучшение дается только на одну гонку!):

    1. 🥾Удобные ботиночки: твоя капибара будет бежать быстрее, шанс победить увеличен.
    Стоимость - 50 арбузных долек

    2. 🍉Вкусный арбуз: шанс победы уменьшается на 5%, но при поражении капибара не потеряет счастья.
    Стоимость - 100 арбузных долек

    3. 💊Антипроигрыш: шанс победить увеличивается до 90%!!! Но при поражении 30 счастья твоей капибары уходит сопернику.
    Стоимость - 150 арбузных долек

