  list-of-things-for-big-it-project: |
    ⬆ <b>Список вещей для большого IT-проекта:</b>

    1️⃣ <b>☕ Банка кофе</b>
    Твоя капибара будет кодить по ночам, шанс завершить всё вовремя увеличивается.
    💰 <i>Стоимость:</i> 50 арбузных долек 🍉

    2️⃣ <b>📚 Курсы по программированию</b>
    Капибара прокачает скиллы, время разработки уменьшается.
    💰 <i>Стоимость:</i> 75 арбузных долек 🍉

    3️⃣ <b>💰 Мешок для денег</b>
    Позволит забрать солидный бонус по завершении проекта.
    💰 <i>Стоимость:</i> 100 арбузных долек 🍉

    4️⃣ <b>👌🏻 Ничего</b>
    Влететь в проект на чистом энтузиазме.

  list-of-things-for-cash-report: |
    ⬆ <b>Список вещей для большого отчёта:</b>

    1️⃣ <b>☕ Банка кофе</b>
    Кофеин творит чудеса — шанс сдать отчёт вовремя увеличивается.
    💰 <i>Стоимость:</i> 50 арбузных долек 🍉

    2️⃣ <b>🖨 Принтер</b>
    Бумажки будут летать быстрее, время подготовки отчёта уменьшается.
    💰 <i>Стоимость:</i> 75 арбузных долек 🍉

    3️⃣ <b>💰 Мешок для денег</b>
    Чтобы премия за успешно сданный отчёт поместилась целиком.
    💰 <i>Стоимость:</i> 100 арбузных долек 🍉

    4️⃣ <b>👌🏻 Ничего</b>
