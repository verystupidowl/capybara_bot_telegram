capybara:
  list-of-commands: |
    📃 <b>Список команд:</b>

    🐾 <b>Моя капибара</b> — показывает всю информацию о твоей капибаре ✨
    👎 <b>Уволиться с работы</b> — покинуть текущее место работу
    💍 <b>Пожениться</b> <i>(ответом на сообщение пользователя)</i> — поженить капибар
    🙅🏻‍♂️ <b>Расторгнуть брак</b> — развестись с текущим партнёром
    🎰 <b>Казино [ставка] [на что]</b> — испытать удачу
    <i>Пример:</i> <code>Казино 500 красное</code>
    🍉 <b>Перевести дольки [количество]</b> <i>(ответом на сообщение пользователя)</i> — поделиться арбузными дольками

    📈 <i>Список будет пополняться!</i>

  list-of-improvements: |
    ⬆ <b>Улучшения для гонок</b> <i>(доступны только на одну гонку)</i>:

    1️⃣ <b>🥾 Удобные ботиночки</b>
    Твоя капибара побежит быстрее, шанс на победу увеличен.
    💰 <i>Стоимость:</i> 50 арбузных долек 🍉

    2️⃣ <b>🍉 Вкусный арбуз</b>
    Шанс победы уменьшается на 5%, но при поражении капибара не потеряет счастье.
    💰 <i>Стоимость:</i> 100 арбузных долек 🍉

    3️⃣ <b>💊 Антипроигрыш</b>
    Шанс победить увеличивается до 90%! Но в случае поражения 30 единиц счастья уйдёт сопернику.
    💰 <i>Стоимость:</i> 150 арбузных долек 🍉

work:
