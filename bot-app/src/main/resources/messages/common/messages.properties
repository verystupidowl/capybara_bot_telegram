capybara.my-capybara=Твоя капибара:\n✨Имя: {0}\n🌟Уровень: {1}\n👑Тип: {2}\n🥱Бодрость: {3}\n💼Работа: {4}\n🍉Дольки арбуза: {5}\n💍Брак: {6}\n🌽Сытость: {7}\n🤩Счастье: {8}
capybara.start-message=Ну привет дружок-пирожок!\nЯ капибаработ, чтобы со мной поиграть, добавь меня в беседу и дай права администратора
capybara.greetings=Привет! Я капибаработ!\nЧтобы ты мог играть со мной, мне нужно дать права доступа\nКак только ты это сделаешь, смело пиши "Взять капибару", чтобы начать играть💫
capybara.start-change-name=✨Как ты хочешь, чтобы звали твою капибарку?\n💬Текст твоего следующего сообщения, отправленного в этот чат, незамедлительно станет новым именем твоей прелестной капибары.\n\n⛔Имя должно быть уникальным в пределах беседы!
capybara.start-change-photo=🖼Пришли новую картинку для своей капибары. Стоимость - 50 долек\nСледующая твоя картинка, отправленная в этот чат, незамедлительно станет новой фотографией твоей прелестной капибары.\n⛔Чтобы отменить это нажми "Не менять ничего"\nИли можешь выбрать случайную за 25 🍉долек!
capybara.deleted=Ты выкинул капибару! Надеюсь ты доволен!