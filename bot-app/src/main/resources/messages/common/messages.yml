capybara:
  feed:
    feed: |
      😋 Твоя капибара успешно покушала!
      ⏳ Возвращайся через 2 часа.
    fatten: |
      🍉 Твоя капибара съела целый арбуз!
      ✨ Её сытость увеличилась на <b>{0}</b>!
      ⏳ Возвращайся через 2 часа.
    cooldown: |
      ⏳ Твоя капибара ещё сыта.
      Покормить снова можно будет только через <b>{0}</b>.
    feed-fatten: |
      🍽 <b>Выбери вариант кормления:</b>

      🟢 <b>Покормить капибару</b>
      ➕ Добавляется 5 сытости
      🍉 Арбузные дольки не тратятся

      🌟 <b>Откормить капибару</b>
      ➕ Добавляется 50 сытости!!!
      🍉 Стоимость — 500 арбузных долек
  happiness:
    cooldown: |
      ⏳ Твоя капибара пока отдыхает.
      Сделать добрые дела снова можно будет через <b>{0}</b>.
    things:
      - title: |
          🥰 Ты погладил капибару!
          ✨ Счастье увеличилось на 5.
        level: 5
        photoUrl: "https://vk.com/photo-209917797_457246188"
      - title: |
          🍉 Ты покормил капибару вкусняшкой!
          ✨ Счастье увеличилось на 20!
        level: 20
        photoUrl: "https://vk.com/photo-209917797_457246189"
      - title: |
          🌳 Ты погулял с капибарой!
          ✨ Счастье увеличилось на 15.
        level: 15
        photoUrl: "https://vk.com/photo-209917797_457246190"
      - title: |
          🎾 Ты поиграл с капибарой!
          ✨ Счастье увеличилось на 10.
        level: 10
        photoUrl: "https://vk.com/photo-209917797_457246191"
      - title: |
          💢 Ты поругал капибару...
          💔 Счастье уменьшилось на 10.
        level: -10
        photoUrl: "https://vk.com/photo-209917797_457246192"
  tea:
    do-tea: |
      ☕ <b>{0}</b>, твой собеседник сегодня — <b>{1}</b>.
      ✨ Счастье увеличено на 10!
    do-tea-in-chat: |
      ☕ <b>{0}</b> и <b>{1}</b> встретились за чашечкой чая.
      ✨ Их счастье увеличено на 10!
    waiting: |
      🪑 Твоя капибара сидит за столом и ждёт собеседника для чаепития!
    cooldown: |
      ⏳ Твоя капибара сможет пойти на чаепитие только через <b>{0}</b>.
    already-waiting: |
      ⚠️ Твоя капибара и так уже ждёт собеседника для чаепития!
  created: |
    🎉 <b>Ура! Теперь у тебя есть капибара!</b>
    
    ✨ Её имя: <b>{0}</b>
    💬 <i>Но ты всегда сможешь поменять его в настройках.</i>
  my-capybara: |
    🐾 <b>Информация о твоей капибаре:</b>

    ✨ Имя: {0}
    🌟 Уровень: {1}
    👑 Тип: {2}
    🥱 Бодрость: {3}
    💼 Работа: {4}
    🍉 Дольки арбуза: {5}
    💍 Брак: {6}
    🌽 Сытость: {7}
    🤩 Счастье: {8}
  start-message: |
    👋 Ну привет, дружок-пирожок!
    
    🤖 Я Капибаработ. Чтобы поиграть со мной, добавь меня в беседу и дай <b>права администратора</b>.
  start:
    change-name: |
      ✨ <b>Как ты хочешь, чтобы звали твою капибарку?</b>
      
      💬 Отправь новое имя следующим сообщением в этот чат, и оно мгновенно станет именем твоего питомца.
      
      ⛔ <i>Имя должно быть уникальным в пределах беседы!</i>
    change-photo: |
      🖼 <b>Пришли новую картинку для своей капибары.</b>
      💰 <i>Стоимость смены фото — 50 долек.</i>
      
      💬 Следующая картинка, отправленная в этот чат, станет новой фотографией твоего питомца.

  greetings: |
    👋 Привет! Я Капибаработ!
    
    🛠 Чтобы я мог работать в чате, мне нужно дать <b>права администратора</b>.
    💬 Как только сделаешь это, смело пиши команду <code>Взять капибару</code>, чтобы начать игру!

  bug-report:
    start: |
      🛠 <b>Опиши случившуюся проблему</b>, и мы постараемся её исправить.
      
      ℹ️ <i>Отправляя сообщение, ты даешь согласие на передачу твоего никнейма админу бота для связи.</i>

    to-admin: |
      ❗️ <b>Пришёл bug-report от {0}</b> ❗️
      
      💬 Чат: id: <code>{1}</code> | имя: {2}
      🐾 Капибара: id: <code>{3}</code> | имя: {4}
      
      📝 <b>Сообщение:</b>
      {5}

    thanks: |
      ✅ <b>Спасибо за обращение!</b> Мы уже изучаем проблему.

  new-level: "🎉 @{0}, твоя капибара <b>{1}</b> достигла нового уровня! Поздравляем! 🌟"
  new-type: |
    🏆 @{0}, грандиозные новости!
    Твоя капибара <b>{1}</b> достигла нового типа <b>{2}</b> и получила бонус — <b>{3}</b> арбузных долек! 🍉🎉
  chosen-random-photo: "🎲 Выбрано случайное фото. Со счёта капибары списано 25 арбузных долек 🍉"

  deleted: "💔 Ты выкинул капибару... Надеюсь, ты доволен своим поступком! 😢"
  error:
    name-too-long: "⚠️ Имя капибары должно быть короче <b>{0}</b> символов!"
    username-not-found: "⚠️ Пользователь с именем <b>{0}</b> не найден в чате!"
    already-doing: "⚠️ Твоя капибара уже занята другим делом: {0}"
    no-money: "⚠️ У твоей капибары недостаточно арбузных долек 🍉. Может, ей пора на работу?"
    not-found: |
      ⚠️ <b>У тебя ещё нет капибары!</b>
      💬 Напиши <code>Взять капибару</code>, чтобы завести питомца.
    already-have: |
      ⚠️ <b>У тебя уже есть капибара!</b>
      🗑 Ты можешь выкинуть её, если хочешь завести новую.